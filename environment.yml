# Reproducible conda environment for qtt_dlrx_simple.
# Create with:  conda env create -f environment.yml
# Then:         conda activate qtt_dlrx_simple && pip install -e .
#
# quimb is pinned to 1.4.0: later releases change the tensor-network API used
# throughout this codebase.
name: qtt_dlrx_simple
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy
  - scipy=1.12.0
  - matplotlib
  - sympy
  - pytest
  - pip
  - pip:
      - opt_einsum==3.4.0
      - autoray==0.7.0
      - quimb==1.4.0
      - findiff
